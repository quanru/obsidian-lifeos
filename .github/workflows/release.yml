name: Build an explicitly selected plugin release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build (for example 1.28.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Validate version, test and build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'if (require("./manifest.json").version !== process.env.RELEASE_VERSION) process.exit(1)'
          npm install -g pnpm@10.7.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          mkdir obsidian-periodic-para
          cp main.js manifest.json styles.css obsidian-periodic-para/
          zip -r "obsidian-periodic-para-${RELEASE_VERSION}.zip" obsidian-periodic-para
      - name: Save build for review
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-periodic-para-${{ inputs.version }}
          path: |
            main.js
            styles.css
            manifest.json
            obsidian-periodic-para-*.zip
